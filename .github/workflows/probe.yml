name: データの確認

# データの土台づくりのときに使う確認（e-Stat の国勢調査の表・国土地理院の避難場所データ）
# main にない workflow_dispatch は動かせないので、確認の部品を変えたPRでも動く。結果はPRにコメントする
# アプリケーションIDは Secrets からだけ渡し、ログ・コメント・成果物に出さない

on:
  pull_request:
    paths:
      - 'scripts/probe-*.mjs'
      - 'src/lib/estat.mjs'
      - 'src/lib/csv.mjs'
      - 'data/shogo.yml'
      - '.github/workflows/probe.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: probe-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: e-Stat（令和7年国勢調査）
        id: estat
        continue-on-error: true
        env:
          ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
        run: node scripts/probe-estat.mjs

      - name: 国土地理院の避難場所データ
        id: hinan
        continue-on-error: true
        run: node scripts/probe-hinan.mjs

      - name: 結果をまとめる
        env:
          ESTAT_OUTCOME: ${{ steps.estat.outcome }}
          HINAN_OUTCOME: ${{ steps.hinan.outcome }}
        run: node scripts/probe-comment.mjs

      - name: 結果のファイルを残す（7日）
        uses: actions/upload-artifact@v4
        with:
          name: probe-out
          path: |
            probe-out/*.json
            probe-out/*.md
          retention-days: 7

      - name: PRにコメント
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          for f in probe-out/comment-*.md; do
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$f"
          done
