name: 出典とリンクの点検

# 出典台帳（data/sources.yml）・自治体の備蓄のページ（data/bichiku.yml があれば）・ページに出ている外部リンクが、GitHub から開けるかを見る
#   WebFetch は古い写しを見ることがあるので、リンクが生きているかはここ（GitHub から開く）で確かめる
#   毎週水曜 10:41（日本時間）：消えたリンクがあれば Issue「リンクの点検」を立てる（開いた Issue があれば中身を最新に書きかえる。なくなったら閉じる）
#   PR（データ・ページのコードを変えたとき）：結果は注記（annotation）と画面の要約に出すだけ。Issue は立てず、PR も止めない
# 分け方：生きている／断られた・つながらなかった（403・429・時間切れなど。消えたとは限らない）／消えた（404・410・名前が引けない・トップに飛ばされた）
#   消えたものは、同じ発行元の新しいページに差しかえる。断られたものは、ブラウザで開けるか見る
# 対象は scripts/check-links.mjs と src/lib/links.mjs の冒頭、相手への気づかいは src/lib/linkcheck.mjs の冒頭を見る（同じホストへは2秒あける・同時に4ホストまで・HEAD がだめなら GET・1回だけやり直し）
# ページのリンクは dist/ から集めるので、先にビルドする（楽天の商品は要らない。ビルドは1秒ほど）
# 時刻は update.yml（月曜 0:07）・deploy.yml（毎朝 6:17）とずらしてある

on:
  schedule:
    - cron: '41 1 * * 3'
  workflow_dispatch:
  pull_request:
    paths:
      - 'data/sources.yml'
      - 'data/bichiku.yml'
      - 'data/estat/meta.json'
      - 'src/**'
      - 'scripts/check-links.mjs'
      - '.github/workflows/check-links.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: links-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: ページを作る（リンクを集めるため）
        # 作れなくても点検は続ける（そのときは dist を捨てて、src の直書きだけ見る。要約に書く）。ビルドの失敗は deploy.yml が止める
        run: |
          npm run build || {
            echo "::warning title=リンクの点検::ビルドできなかったので、ページに出ているリンクは src の直書きだけ見ます"
            rm -rf dist
          }

      - name: リンクを開いてみる
        id: chk
        # この点検は知らせるだけ。消えたリンクがあっても失敗にはしない（スクリプトが壊れたときだけ失敗）
        continue-on-error: true
        run: node scripts/check-links.mjs --report report.md

      - name: 止まったことを注記に
        if: steps.chk.outcome == 'failure'
        run: echo "::warning title=リンクの点検::点検のスクリプトが途中で止まりました（このステップのログを見てください）"

      - name: 結果を画面の要約に出す
        if: always() && hashFiles('report.md') != ''
        run: cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Issue に書く・閉じる（週1回のとき）
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.chk.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GONE: ${{ steps.chk.outputs.gone }}
          NOTES: ${{ steps.chk.outputs.notes }}
        run: |
          gh label create "リンクの点検" --color D93F0B --description "毎週のリンクの点検" --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          N=$(gh issue list --repo "$GITHUB_REPOSITORY" --label "リンクの点検" --state open --json number --jq '.[0].number')
          if [ "$GONE" != "0" ]; then
            if [ -n "$N" ]; then
              gh issue edit "$N" --repo "$GITHUB_REPOSITORY" --body-file report.md
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "リンクの点検：消えたリンクがあります" --label "リンクの点検" --body-file report.md
            fi
          elif [ -n "$N" ] && [ "$NOTES" = "0" ]; then
            gh issue close "$N" --repo "$GITHUB_REPOSITORY" --comment "$(TZ=Asia/Tokyo date +%F) の点検で、消えたリンクはなくなりました。"
          fi

      - name: 止まったら Issue（週1回のとき）
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.chk.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --title "リンクの点検が止まった（$(TZ=Asia/Tokyo date +%F)）" \
            --body "週1回のリンクの点検が、スクリプトの途中で止まりました。$RUN"
