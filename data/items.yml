# 備えの数字（まちの社会科）
# このサイトの備えの数字はここにだけ置く。本文・計算・チェックリスト・品目ページ・クイズはここから読む。
# 数字はすべて sources.yml の出典 id を書く。資料によって目安がちがうときは「最低・できれば」の両方を書く。
# per_day は「1人1日あたり」。null は目安の数字をまだ出典で確かめていないもの（計算には使わない）。

days:
  min: 3            # 最低3日分
  better: 7         # できれば1週間分
  choices: [3, 7]   # 計算の日数のマス
  sources: [maff-sonae, hiroshima-toilet, kanagawa-toilet]

# 乳幼児・妊産婦・高齢者・慢性疾患・食物アレルギーなどの人は、少なくとも2週間分
yohairyo_days: 14
yohairyo_sources: [nerima-yohairyo, maff-stock]

items:
  - id: mizu
    name: 水
    unit: L
    per_day: 3
    calc: true
    hinmoku: true
    sources: [maff-sonae, miyagi-mizu]
    about: 飲み水と調理の水。トイレを流す水は別に要る

  - id: shushoku
    name: 主食
    unit: 食
    per_day: 3
    calc: true
    hinmoku: true
    sources: [maff-sonae]
    about: 1人1日3食で数える

  - id: keitai-toilet
    name: 携帯トイレ
    unit: 回分
    per_day: 5
    calc: true
    hinmoku: true
    sources: [hiroshima-toilet, kanagawa-toilet, suginami-toilet]
    about: 断水・停電・配管の被害で水洗トイレが使えなくなることがある

  - id: gas
    name: カセットコンロとボンベ
    unit: 本
    per_day: null
    calc: false
    hinmoku: true
    sources: [maff-sonae]
    about: 農林水産省の大人1人1週間の例にボンベ6本。家族の人数での数え方は、品目ページを作るときに出典で確かめる

  - id: light
    name: ライト
    unit: 個
    per_day: null
    calc: false
    hinmoku: true
    sources: [nagasaki-mochidashi]
    about: 長崎市の非常持出品の例に懐中電灯。目安の数は、品目ページを作るときに公的な資料で確かめる

  - id: battery
    name: モバイルバッテリー
    unit: 個
    per_day: null
    calc: false
    hinmoku: true
    sources: [nagasaki-mochidashi]
    about: 長崎市の非常持出品の例にモバイルバッテリー。目安の数は、品目ページを作るときに公的な資料で確かめる

# チェックリスト（/dougu/check/）。並びはページに出す順
# item は上の品目を指す（calc: true の品目は、人数と日数で量を出す。qty: false で量を出さない）
# item のないものは name と出典（sources）を書く。sub は名前の下の小さな1行
checklists:
  - id: bichiku
    name: 家に置く備え
    entries:
      - item: mizu
        name: 水（飲み水と調理の水）
        sources: [kantei-sonae, miyagi-mizu]
      - name: 生活用水
        sub: トイレを流す水など。飲み水とは別
        sources: [kantei-sonae, miyagi-mizu]
      - item: shushoku
        name: 主食（ご飯・アルファ米・乾パンなど）
        sources: [kantei-sonae]
      - name: おかずになる缶詰など
        sources: [kantei-sonae]
      - item: keitai-toilet
        name: 携帯トイレ・簡易トイレ
        sources: [kantei-sonae]
      - name: トイレットペーパー・ティッシュペーパー
        sources: [kantei-sonae, miyagi-mizu]
      - item: gas
        sources: [kantei-sonae, miyagi-mizu]
      - name: マッチ・ろうそく
        sources: [kantei-sonae, miyagi-mizu]

  - id: mochidashi
    name: 持ち出す袋
    entries:
      - name: 飲料水
        sources: [nagasaki-mochidashi]
      - name: 火を通さずに食べられるもの（缶詰・ビスケットなど）
        sources: [nagasaki-mochidashi]
      - name: 貴重品（現金・小銭・印鑑・預金通帳・健康保険証など）
        sources: [nagasaki-mochidashi]
      - item: light
        name: 懐中電灯
      - name: 携帯ラジオ
        sources: [nagasaki-mochidashi]
      - item: battery
      - name: ヘルメット・防災ずきん・軍手
        sources: [nagasaki-mochidashi]
      - name: 救急用品（消毒液・常備薬・包帯など）
        sources: [nagasaki-mochidashi]
      - name: マスク・消毒用アルコール・体温計
        sources: [nagasaki-mochidashi]
      - name: 衣類・下着・タオル・毛布・雨具
        sources: [nagasaki-mochidashi]
      - name: 洗面用具・ウェットティッシュ・生理用品
        sources: [nagasaki-mochidashi]
      - item: keitai-toilet
        qty: false
        sources: [nagasaki-mochidashi]
      - name: ミルク・紙おむつ・ほ乳びん
        sub: 乳児がいる家
        sources: [nagasaki-mochidashi]
