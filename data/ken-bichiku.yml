# title は開いて確かめたページの題そのまま（サイト名の部分は除く）。checked は開いて確かめた日
# 並びは PREFS の順。国・市町村のページ、PDF だけのものは入れない
# note はそのページに書いてあることを1文（全角60字まで・「。」で終わる）。開いて読んだことだけ・評価やくらべは書かない（決まりは data/bichiku.yml と同じ）

