# e-Stat から取る表（まちの社会科）
# scripts/fetch-estat.mjs がこの一覧のとおりに取り、data/estat/munis.json（全市区町村の数字）を作る。
# 2026-10-22 のデータの確認（PR #1）で、堺市・名古屋市の公式の数字と照らし合わせた表。
# 年齢・世帯の類型・住宅は「不詳補完値」（年齢などが不詳の人を割り振った値）の表を使う。人口・世帯数の合計は原数値と同じ。
# take の名前は e-Stat の分類の名前そのもの。書いていない分類は先頭（総数など）を使う。

survey: 2025-10-01
published: 2026-09-29
statName: 令和7年国勢調査
# 今の市区町村の一覧（全国・都道府県・市区町村・政令市の区。2000年の市区町村をふくまない表）
areasFrom: "0004066344"

tables:
  - id: "0004066121"
    name: 1-1-1 男女別人口（不詳補完値）
    take:
      pop:
        tab: 人口
        cat01: 総数
      male:
        tab: 人口
        cat01: 男
      female:
        tab: 人口
        cat01: 女

  - id: "0004066141"
    name: 1-1-3 2020年の人口（組替）・5年間の人口増減・面積・人口密度（不詳補完値）
    take:
      pop2020:
        tab: 2020年（令和2年）の人口（組替）
      popChange:
        tab: 5年間の人口増減数
      popChangeRate:
        tab: 5年間の人口増減率
      hh2020:
        tab: 2020年（令和2年）の世帯数（組替）
      menseki:
        tab: 面積（参考）
      density:
        tab: 人口密度

  - id: "0004066122"
    name: 1-1-2 世帯の種類別世帯数及び世帯人員（不詳補完値）
    take:
      hh:
        tab: 世帯数
        cat01: 総数
      ippan:
        tab: 世帯数
        cat01: 一般世帯

  - id: "0004066344"
    name: 6-3-2 一般世帯人員及び一般世帯の1世帯当たり人員（不詳補完値）
    take:
      perHh:
        tab: 一般世帯の1世帯当たり人員

  - id: "0004066183"
    name: 2-7-1 男女、年齢（5歳階級）別人口（不詳補完値）
    take:
      age014:
        tab: 人口
        cat01: 国籍総数
        cat02: 総数
        cat03: （再掲）15歳未満
      age1564:
        tab: 人口
        cat01: 国籍総数
        cat02: 総数
        cat03: （再掲）15～64歳
      age65:
        tab: 人口
        cat01: 国籍総数
        cat02: 総数
        cat03: （再掲）65歳以上
      age75:
        tab: 人口
        cat01: 国籍総数
        cat02: 総数
        cat03: （再掲）75歳以上

  - id: "0004066237"
    name: 32-4 世帯の家族類型、65歳以上世帯員の有無別一般世帯数（不詳補完値）
    take:
      single:
        tab: 一般世帯数
        cat01: 総数
        cat02: 単独世帯
      with65:
        tab: 一般世帯数
        cat01: うち65歳以上世帯員がいる世帯
        cat02: 総数
      single65:
        tab: 一般世帯数
        cat01: 総数
        cat02: （再掲）65歳以上の単独世帯

  - id: "0004066210"
    name: 24-4 住宅の所有の関係、住宅の建て方別一般世帯数（不詳補完値）
    take:
      housed:
        tab: 一般世帯数
        cat01: 総数
        cat02: 住宅に住む一般世帯
      ikkodate:
        tab: 一般世帯数
        cat01: 総数
        cat02: 一戸建
      nagaya:
        tab: 一般世帯数
        cat01: 総数
        cat02: 長屋建
      kyodo:
        tab: 一般世帯数
        cat01: 総数
        cat02: 共同住宅
