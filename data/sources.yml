# 出典台帳（まちの社会科）
# 数字・決まりの出どころは、ここに1つずつ書く。ページ・計算・クイズは id で出典を指す。
# checked はその出典を開いて確かめた日。数字を変えるときは出典を開き直して checked を書きかえる。
# kind：sonae（備えの数字）・estat（統計）・hinan（避難場所データ）・rule（規約・クレジット）・shogo（照らし合わせ用の公式の発表）
# title はページの題そのもの。まだ題を確かめていないものは null にして、ページに出す前に確かめる。
# about は、このサイトで何に使うか（出典の言葉をそのまま写さず、自分の言葉で短く）。

